services:
  
  mongodb:
    image : mongo:7.0
    container_name: opa_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes: 
      - mongo_data:/data/db
    ports:
      - 27017:27017

  app:
    build: .
    container_name: opa_app
    depends_on:
      - mongodb
    env_file:
      - .env

volumes:
  mongo_data: