services:
  mongodb:
    image: mongo:7.0
    container_name: opa_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: opa_postgres
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: opa_app
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    command: bash /app/docker-entrypoint-app.sh
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      - pipeline_logs:/app/logs

  streamlit:
    build: .
    container_name: opa_streamlit
    depends_on:
      - app
    env_file:
      - .env
    command: python -m streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - .:/app

  scheduler:
    build: .
    container_name: opa_scheduler
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    command: bash /app/docker-entrypoint-scheduler.sh
    volumes:
      - .:/app
      - pipeline_logs:/app/logs

volumes:
  mongo_data:
  postgres_data:
  pipeline_logs:
