services:
  mongodb:
    image: mongo:7.0
    container_name: opa_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: opa_postgres
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: opa_app
    depends_on:
      mongodb:
        condition: service_started
      postgres:
        condition: service_started
    env_file:
      - .env
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      - pipeline_logs:/app/logs

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: opa_streamlit
    depends_on:
      - app
    env_file:
      - .env
    command: python -m streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - .:/app

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opa_scheduler
    depends_on:
      - mongodb
      - postgres
    env_file:
      - .env
    command: sh docker-entrypoint-scheduler.sh
    volumes:
      - .:/app
      - pipeline_logs:/app/logs

  prometheus:
    image: prom/prometheus:latest
    container_name: cryptobot_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: cryptobot_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mongo_data:
  postgres_data:
  pipeline_logs:
  grafana_data:
  


